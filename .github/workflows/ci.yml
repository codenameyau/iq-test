name: ci

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=$(printf '%s' 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.5.1"
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
      - name: Configure SSH
        env:
          SSH_HOSTNAME: ${{ secrets.DEPLOY_SSH_HOSTNAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SSH_HOSTNAME="$(trim "${SSH_HOSTNAME:-}")"
          DEPLOY_USER="$(trim "${DEPLOY_USER:-}")"
          DEPLOY_SSH_KEY="$(printf '%s' "${DEPLOY_SSH_KEY:-}" | tr -d '\r')"
          missing=()
          [[ -n "$SSH_HOSTNAME" ]] || missing+=("DEPLOY_SSH_HOSTNAME")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_SSH_KEY" ]] || missing+=("DEPLOY_SSH_KEY")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing or empty secret(s): ${missing[*]}"
            echo "Add them under Settings → Environments → production."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            printf 'Host deploy-target\n'
            printf '  HostName %s\n' "$SSH_HOSTNAME"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  ProxyCommand cloudflared access ssh --hostname %%h\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Roll out on the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Missing DATABASE_URL in the production environment."
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target \
            "sudo docker login ghcr.io -u $(printf '%q' "$GHCR_USER") --password-stdin"
          DATABASE_URL_B64="$(printf '%s' "$DATABASE_URL" | base64 -w 0)"
          ssh deploy-target \
            "sudo --preserve-env=IMAGE,DATABASE_URL_B64,PORT env IMAGE='${{ needs.image.outputs.name }}:${{ github.sha }}' DATABASE_URL_B64='$DATABASE_URL_B64' PORT=3300 bash -s" \
            < deploy/remote.sh
